# Production Override for SwingView Cloud IDE
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 
# This file extends the base docker-compose.yml with production-specific settings

version: '3.8'

services:
  code-server:
    # Use healthcheck for production monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Enhanced environment for production
    environment:
      - SUDO_PASSWORD=${CODE_SERVER_PASSWORD}
      - BIND_ADDR=0.0.0.0:8443
      - CERT=/home/coder/.certs/cert.pem
      - CERT_KEY=/home/coder/.certs/key.pem
      - LOG_LEVEL=info
      - AUTH=password
    
    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=code-server,env=production"
    
    # Restart policy
    restart: always
    
    # Additional volumes for SSL certificates (if using)
    volumes:
      - ./:/home/coder/project
      - code-server-data:/home/coder/.local
      - ./.certs:/home/coder/.certs:ro
    
    networks:
      - swingview-network
    
    # Port binding for reverse proxy
    expose:
      - "8443"

  api:
    # Healthcheck for API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Production environment
    environment:
      - FLASK_ENV=production
      - FLASK_APP=scripts/app.py
      - DEBUG=False
    
    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api,env=production"
    
    # Restart policy
    restart: always
    
    networks:
      - swingview-network

  # Optional: Nginx reverse proxy for HTTPS/routing
  nginx:
    image: nginx:latest
    container_name: swingview-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    restart: always
    networks:
      - swingview-network
    depends_on:
      - code-server
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=nginx,env=production"

volumes:
  code-server-data:

networks:
  swingview-network:
    driver: bridge
